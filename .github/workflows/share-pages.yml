name: Refresh share pages

on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: share-pages
  cancel-in-progress: true

jobs:
  refresh:
    # GITHUB_TOKEN pushes do not start a new run. This also skips a push whose
    # own commit is the share-page update, so the job cannot loop.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Update share pages')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate share pages
        run: node scripts/build-share-pages.js

      - name: Commit share pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A p images/og
          if git diff --cached --quiet; then
            echo "Share pages are up to date"
            exit 0
          fi
          git commit -m "Update share pages"
          git push
